<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guidely smoke test</title>
    <style>
      /* Makes the reduced-motion handling observable: scrolls are smooth here
         unless the visitor prefers reduced motion. */
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0 auto;
        max-width: 40rem;
        padding: 1rem;
      }
      .controls {
        background: white;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0.5rem 0;
        position: sticky;
        top: 0;
      }
      .card {
        background: #dbeafe;
        border-radius: 8px;
        margin: 60vh 0;
        padding: 1rem;
      }
      .scroller {
        border: 1px solid #94a3b8;
        height: 200px;
        overflow: auto;
      }
      .corner {
        background: #fde68a;
        height: 32px;
        position: fixed;
        width: 32px;
      }
      .dark {
        --guidely-tooltip-background: #1e293b;
        --guidely-tooltip-color: #f8fafc;
        --guidely-tooltip-border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <h1>Guidely smoke test</h1>
    <div class="controls">
      <button id="tour">Start tour</button>
      <button data-target="#first">Selector target</button>
      <button id="element-target">Element target</button>
      <button data-target="#nested">Nested scroller</button>
      <button data-target="#corner-tl">Top-left corner</button>
      <button data-target="#corner-tr">Top-right corner</button>
      <button data-target="#corner-bl">Bottom-left corner</button>
      <button data-target="#corner-br">Bottom-right corner</button>
      <button data-target="#missing">Missing target</button>
      <button id="theme">Toggle theme</button>
      <button id="destroy">Destroy</button>
      <output id="result"></output>
    </div>
    <div class="card" id="first">First card</div>
    <div class="card" id="second">Second card</div>
    <div class="scroller">
      <div class="card" id="nested">Card in a nested scroller</div>
    </div>
    <div style="height: 60vh"></div>
    <div class="corner" id="corner-tl" style="left: 0; top: 0"></div>
    <div class="corner" id="corner-tr" style="right: 0; top: 0"></div>
    <div class="corner" id="corner-bl" style="bottom: 0; left: 0"></div>
    <div class="corner" id="corner-br" style="bottom: 0; right: 0"></div>

    <script type="module">
      import {
        createSpotlight,
        createTooltip,
        createTour,
      } from '../dist/index.js';

      const spotlight = createSpotlight();
      const tooltip = createTooltip();
      const result = document.querySelector('#result');
      const tour = createTour({
        steps: [
          {
            target: '#first',
            title: 'First card',
            description: 'Selector target.',
          },
          {
            target: '#missing',
            title: 'Never shown',
            description: 'A missing target is skipped.',
          },
          {
            target: document.querySelector('#second'),
            title: 'Second card',
            description: 'Element target, scrolled into view.',
          },
          {
            target: '#nested',
            title: 'Nested card',
            description: 'Inside a nested scroller.',
          },
        ],
        onComplete: () => (result.textContent = 'onComplete called'),
        onExit: () => (result.textContent = 'onExit called'),
      });
      const clearManual = () => {
        spotlight.destroy();
        tooltip.destroy();
      };
      const show = (target, name) => {
        tour.destroy();
        const shown = spotlight.show(target);
        tooltip.show(target, {
          title: name,
          description: 'Markup stays text: <img src=x onerror="alert(1)">',
        });
        result.textContent = `show() returned ${shown}`;
      };

      for (const button of document.querySelectorAll('[data-target]')) {
        button.onclick = () => show(button.dataset.target, button.textContent);
      }
      document.querySelector('#element-target').onclick = () =>
        show(document.querySelector('#second'), 'Element target');
      document.querySelector('#tour').onclick = () => {
        clearManual();
        result.textContent = `start() returned ${tour.start()}`;
      };
      document.querySelector('#theme').onclick = () =>
        document.documentElement.classList.toggle('dark');
      document.querySelector('#destroy').onclick = () => {
        tour.destroy();
        clearManual();
        result.textContent = '';
      };
    </script>
  </body>
</html>
