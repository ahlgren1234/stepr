<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guidely spotlight demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0 auto;
        max-width: 40rem;
        padding: 1rem;
      }
      .controls {
        background: white;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0.5rem 0;
        position: sticky;
        top: 0;
      }
      .card {
        background: #dbeafe;
        border-radius: 8px;
        margin: 60vh 0;
        padding: 1rem;
      }
      .scroller {
        border: 1px solid #94a3b8;
        height: 200px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>Spotlight demo</h1>
    <div class="controls">
      <button data-target="#first">Selector target</button>
      <button id="element-target">Element target</button>
      <button data-target="#nested">Nested scroller</button>
      <button data-target="#missing">Missing target</button>
      <button id="destroy">Destroy</button>
      <output id="result"></output>
    </div>
    <div class="card" id="first">First card</div>
    <div class="card" id="second">Second card</div>
    <div class="scroller">
      <div class="card" id="nested">Card in a nested scroller</div>
    </div>
    <div style="height: 60vh"></div>

    <script type="module">
      import { createSpotlight } from '../dist/index.js';

      const spotlight = createSpotlight();
      const result = document.querySelector('#result');
      const show = (target) => {
        result.textContent = `show() returned ${spotlight.show(target)}`;
      };

      for (const button of document.querySelectorAll('[data-target]')) {
        button.onclick = () => show(button.dataset.target);
      }
      document.querySelector('#element-target').onclick = () =>
        show(document.querySelector('#second'));
      document.querySelector('#destroy').onclick = () => {
        spotlight.destroy();
        result.textContent = '';
      };
    </script>
  </body>
</html>
